[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err

[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker.err

; ProcessDataTransfer runs on the dedicated `data-transfers` connection/queue
; (config/queue.php). Timeout matches the job's 900s limit; stopwaitsecs lets an
; in-flight import/export finish before the worker is stopped.
[program:data-transfer-worker]
command=php /var/www/html/artisan queue:work data-transfers --queue=data-transfers --sleep=3 --tries=3 --timeout=900
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
stdout_logfile=/var/log/supervisor/data-transfer-worker.log
stderr_logfile=/var/log/supervisor/data-transfer-worker.err

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err
