name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: composer audit --locked --no-interaction --abandoned=fail
      - run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, pint
      - run: composer install --no-interaction --no-progress
      - run: pint --test

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stms_test
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stms_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: npm run check:inventory
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stms_test
          DB_USERNAME: root
          DB_PASSWORD: root

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: pcov
      - run: cp .env.example .env
      - run: composer install --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan test --coverage-clover=coverage.xml --coverage-text
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - name: Enforce PCOV statement coverage ratchet
        run: php scripts/check-coverage-threshold.php coverage.xml 74.5
      - uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:tenant-bypasses
      - run: npm run build
      - run: npm run build:budget
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: public/build/

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: touch database/e2e.sqlite
      - run: php artisan migrate:fresh --seed --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://127.0.0.1:8000
          PUBLIC_REGISTRATION_ENABLED: 'false'
          SEED_DEMO_DATA: 'true'
          DB_CONNECTION: sqlite
          DB_DATABASE: database/e2e.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
      - run: npm run test:e2e
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://127.0.0.1:8000
          PUBLIC_REGISTRATION_ENABLED: 'false'
          SEED_DEMO_DATA: 'true'
          DB_CONNECTION: sqlite
          DB_DATABASE: database/e2e.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
